# Production stack on the VPS: API, Redis and Caddy (HTTPS). Postgres runs on Supabase.
# Celery workers get added here when they exist (docs/backend.md, Deployment).
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build
services:
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    env_file: .env.prod
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.8.4-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Only Caddy is reachable from outside. It gets the HTTPS certificate for API_DOMAIN by itself.
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in infra/.env.prod}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  redis_data:
  caddy_data:
  caddy_config:
